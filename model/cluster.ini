# ============================================================================
# Dynare parallel configuration -- single local machine, multiple cores.
#
# Launch with:
#     dynare frbstl_us_est_fastlr_lean parallel conffile=cluster.ini
#
# Set CPUnbr below to your PHYSICAL core count, and make it match mh_nblocks
# in the .mod (one chain per core). Dynare farms the MH chains -- and later
# bayesian_irf / prior_posterior_statistics / mode_check -- across these cores.
# Works under both MATLAB and Octave (it launches CPUnbr worker processes).
# ============================================================================

[cluster]
Name=local
Members=n1

[node]
Name=n1
ComputerName=localhost
CPUnbr=8
# --- usually auto-detected on a local node; uncomment only if Dynare complains ---
# Local=1
# OperatingSystem=unix          # unix (Linux/macOS) or windows
# MatlabOctavePath=matlab       # or the full path to matlab / octave
# DynarePath=/usr/lib/dynare/matlab
